<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caitlin · opening, YouTube source, outro and Zoom</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#00001f;color:#fff;font-family:Arial,sans-serif}.stage{position:absolute;inset:0 0 54px;display:grid;place-items:center}video,iframe,img{width:100%;height:100%;object-fit:contain;border:0}#yt,#zoom{display:none}#zoom{animation:zoom 5s linear forwards}@keyframes zoom{to{transform:scale(1.018)}}.bar{position:absolute;bottom:0;left:0;right:0;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:#101a37;font-size:15px}.bar button,.bar a{padding:8px 12px;background:#d8bc85;color:#00001f;border:0;border-radius:4px;text-decoration:none;cursor:pointer}.notice{display:none;position:absolute;inset:10%;background:#00001fe8;padding:30px;text-align:center;place-content:center;z-index:4}.notice a{color:#f2d495}#state{flex:1}@media(max-width:500px){.bar{font-size:12px;padding:6px;gap:5px}.bar button{padding:8px}}</style></head><body>
<div class="stage"><video id="local" autoplay muted playsinline controls src="../video-kit/01_intro.mp4"></video><div id="yt"></div><img id="zoom" src="../video-kit/07_zoom_mockup_2x.png" alt="French Atelier live Zoom mockup"></div>
<div class="notice" id="notice">The original YouTube source is unavailable in this browser.<br><br><a href="https://www.youtube.com/watch?v=WbodfrXFjyg" target="_blank" rel="noopener">Open the original Caitlin video</a><br><br><button onclick="outro()">Review the outro and Zoom ending</button></div>
<div class="bar"><span id="state">Approved opening</span><button id="sound">Sound on</button><button onclick="location.reload()">Restart</button><a href="https://www.youtube.com/watch?v=WbodfrXFjyg" target="_blank" rel="noopener">Source ↗</a></div>
<script>
let player,phase='intro',sound=false,ready=false;const video=document.getElementById('local'),zoom=document.getElementById('zoom'),state=document.getElementById('state');
document.getElementById('sound').onclick=()=>{sound=!sound;video.muted=!sound;if(player&&ready){sound?player.unMute():player.mute()}document.getElementById('sound').textContent=sound?'Sound off':'Sound on'};
function showSource(){phase='source';video.style.display='none';document.getElementById('yt').style.display='block';state.textContent='Caitlin · original website YouTube';if(ready){if(!sound)player.mute();player.playVideo()}}
function outro(){phase='outro';document.getElementById('notice').style.display='none';document.getElementById('yt').style.display='none';if(player&&ready)player.stopVideo();video.style.display='block';video.src='../video-kit/02_outro.mp4';video.muted=!sound;video.play().catch(()=>{});state.textContent='Approved closing'}
video.addEventListener('ended',()=>{if(phase==='intro')showSource();else if(phase==='outro'){phase='zoom';video.style.display='none';zoom.style.display='block';state.textContent='Zoom mockup ending';setTimeout(()=>{state.textContent='End of edit'},5000)}});
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{videoId:'WbodfrXFjyg',playerVars:{playsinline:1,rel:0,autoplay:0,mute:1},events:{onReady:()=>{ready=true;if(phase==='source')showSource()},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED&&phase==='source')outro()},onError:()=>{if(phase==='source')document.getElementById('notice').style.display='grid'}}})};
const api=document.createElement('script');api.src='https://www.youtube.com/iframe_api';document.head.append(api);
</script></body></html>
